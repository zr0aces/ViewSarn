upstream viewsarn_backend {
    server viewsarn:3000;
    keepalive 32;
}

# Optional rate-limit zone in nginx
limit_req_zone $binary_remote_addr zone=viewsarn_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Client body limit matching or exceeding ViewSarn's BODY_LIMIT (15mb default)
    client_max_body_size 20M;

    # Timeouts sized for rendering large documents
    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    # Gzip disabled for binary responses (PDF/PNG)
    gzip off;

    location / {
        limit_req zone=viewsarn_limit burst=20 nodelay;

        proxy_pass http://viewsarn_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint for load balancers
    location /health {
        proxy_pass http://viewsarn_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Internal metrics endpoint (restrict to monitoring subnets)
    location /metrics {
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;

        proxy_pass http://viewsarn_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
