apiVersion: apps/v1
kind: Deployment
metadata:
  name: viewsarn
  labels:
    app.kubernetes.io/name: viewsarn
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: viewsarn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: viewsarn
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      containers:
        - name: viewsarn
          image: ghcr.io/zr0aces/viewsarn:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: viewsarn-config
          volumeMounts:
            - name: output-volume
              mountPath: /output
            - name: keys-volume
              mountPath: /app/apikeys.txt
              subPath: apikeys.txt
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
            - name: shm-volume
              mountPath: /dev/shm
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: output-volume
          persistentVolumeClaim:
            claimName: viewsarn-output-pvc
        - name: keys-volume
          secret:
            secretName: viewsarn-keys
            items:
              - key: apikeys.txt
                path: apikeys.txt
                mode: 0400
        - name: tmp-volume
          emptyDir: {}
        - name: shm-volume
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
