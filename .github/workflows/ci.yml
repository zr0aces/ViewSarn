name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The tests deliberately stop at the browser boundary, so no Chromium
      # download is needed here. Render behaviour is verified against the image.
      - name: Run tests
        run: npm test

      # VERSION is the source of truth; this is the gate that keeps the files
      # derived from it honest.
      - name: Check version consistency
        run: npm run version:check
