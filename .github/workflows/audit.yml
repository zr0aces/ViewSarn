name: Dependency audit

# Not part of the per-push CI: a new advisory published overnight would turn
# every unrelated pull request red. Release tags run the same command in
# docker-publish.yml, which is where it blocks.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
