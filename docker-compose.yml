services:
  viewsarn:
    build: .
    image: viewsarn:latest
    container_name: viewsarn
    ports:
      - "3000:3000"
    environment:
      # Server Configuration
      - PORT=3000
      - OUTPUT_DIR=/output
      - LOG_LEVEL=info

      # Authentication (choose one method)
      # Method 1: Multiple API keys via file (recommended)
      - API_KEYS_FILE=/app/apikeys.txt
      # Method 2: Single API key (uncomment to use)
      # - API_KEY=your-secret-key-here
      #
      # Create apikeys.txt BEFORE `docker compose up` (e.g. `npm run apikey:generate -- -f apikeys.txt`).
      # If the file is missing, Docker creates a directory at that path and the service refuses to start.
      # To run with no keys on purpose, set AUTH_DISABLED=true. Confirm with:
      #   curl localhost:3000/health   ->  "apiAuthFileInUse": true

      # API Keys Auto-reload Interval (milliseconds)
      - API_KEYS_RELOAD_MS=30000

      # Set when a reverse proxy or ingress sits in front, to the number of
      # proxy hops. Left unset, req.ip is the proxy's address and every
      # anonymous caller is rate limited as a single client.
      # - TRUST_PROXY=1

      # Rate Limiting — shapes arrival rate, not concurrent renders.
      # Counters are per process: N replicas allow N x RATE_LIMIT_MAX overall.
      - RATE_LIMIT_MAX=120
      - RATE_LIMIT_WINDOW_MS=60000

      # --- Render limits: these are what bound peak memory ---
      #
      # Budget against the 2G limit at the bottom of this file:
      #   baseline                      ~130 MB
      #   2 renders x ~150 MB            ~300 MB
      #   32 queued x 15 MB body         ~480 MB
      #                                 ---------
      #                                  ~910 MB, comfortably inside 2G
      #
      # Raise these together with the memory and cpus limits below, never alone.

      # Concurrent Chromium pages. Pinned deliberately: the default is
      # os.availableParallelism(), which follows CPU affinity and NOT the CFS
      # quota that `cpus:` sets — on a 32-core host it would return 32.
      - RENDER_CONCURRENCY=2

      # Requests allowed to wait for a slot before the service returns 503.
      # Each one holds its parsed body, so this is the backlog memory bound.
      - RENDER_QUEUE_MAX=32

      # Per-render deadline before the service returns 504.
      - RENDER_TIMEOUT_MS=60000

      # A queued request that waits longer than this gets 503.
      - RENDER_QUEUE_WAIT_MS=30000

      # Output ceilings; a larger render is refused with 413. A full-page PNG
      # costs about 22 bytes per device pixel (measured), so 25M pixels is about
      # 550 MB; RENDER_CONCURRENCY x that plus ~150 MB idle must fit the memory
      # limit below. MAX_PDF_PAGES is unmeasured.
      - MAX_PNG_PIXELS=25000000
      - MAX_PDF_PAGES=200

      # Renders one key may have running or queued at once (0 = no cap). Set on
      # shared deployments so one caller cannot hold every slot.
      - MAX_INFLIGHT_PER_KEY=0

      # Bytes one key may keep under /output (0 = no cap). Files are never
      # deleted by the service, so shared deployments should set this.
      - OUTPUT_MAX_BYTES=0

      # Wrong keys tolerated per IP per window before a 429.
      - AUTH_FAIL_MAX=30

      # Private, loopback and link-local destinations stay reachable from
      # rendered HTML only if named here: hostnames, IPs, CIDRs, comma-separated.
      # Empty blocks them all, including the cloud metadata address.
      - EGRESS_ALLOW=

      # Seconds-scale ceiling for graceful shutdown before a forced exit.
      - SHUTDOWN_TIMEOUT_MS=10000

      # Max request body. Raising this multiplies the queue budget above:
      # RENDER_QUEUE_MAX x BODY_LIMIT is the worst-case backlog.
      - BODY_LIMIT=15mb

      # Node.js Configuration (already set in the image; explicit here for
      # anyone building a variant — controls JSON vs pretty logging)
      - NODE_ENV=production

      # The root filesystem is read-only (below), so Chromium's profile and
      # cache go to the /tmp tmpfs.
      - HOME=/tmp
    volumes:
      # Mount output directory for saved files
      - ./output:/output

      # Mount API keys file (read-only)
      # Create apikeys.txt before starting: npm run apikey:generate -- -f apikeys.txt
      - ./apikeys.txt:/app/apikeys.txt:ro

    # Container hardening. Chromium runs with --no-sandbox (its own sandbox needs
    # SYS_ADMIN or an unconfined seccomp profile, both broader than this), so the
    # container itself is the boundary. Verified against the image: Thai PDFs,
    # PNGs and saved output all render with these settings.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

    # Shared memory for Chromium. The 64MB default crashes pages under load.
    # Increase for large documents or higher RENDER_CONCURRENCY.
    shm_size: "1gb"

    # Restart policy
    restart: unless-stopped

    # The health check lives in the Dockerfile (HEALTHCHECK), so one definition
    # serves docker run, Compose and orchestrators.

    # Resource limits (optional but recommended for production)
    # Keep in step with RENDER_CONCURRENCY and RENDER_QUEUE_MAX above.
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
